<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#100b15">
<title>The Night Shift — Career Edition</title>
<style>
:root{--bg:#0f0a14;--panel:#1b1422;--panel2:#241a2d;--line:#3c2c47;--accent:#b76ae3;--gold:#f1c66c;--good:#6cda98;--bad:#ef7777;--text:#f8f0e9;--muted:#a99eae}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#07050a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
button{font:inherit;color:inherit}#app{max-width:820px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a1735,#100b15 48%);padding-bottom:92px}
header{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 15px 10px;background:#120d18ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:2px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stat{background:#211728;border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px;font-size:10px}.stat b{display:block;font-size:15px;margin-top:2px}.xp{height:7px;background:#30233a;border-radius:20px;overflow:hidden;margin-top:7px}.xp i{display:block;height:100%;background:linear-gradient(90deg,#8649b5,#dc8df1)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:820px;margin:auto;background:#140e1bf4;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}nav button{background:none;border:0;color:#9f93a8;font-size:9px;padding:4px 1px;border-radius:9px}nav button b{display:block;font-size:19px;line-height:20px}nav button.active{color:white;background:#2c1d37}
main{padding:14px}.panel{background:linear-gradient(180deg,#1e1725,#18121e);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 28px #0003}h2{font-size:18px;margin:0 0 9px}h3{font-size:14px;margin:13px 0 7px}.muted{color:var(--muted)}.small{font-size:12px}.gold{color:var(--gold)}.good{color:var(--good)}.bad{color:var(--bad)}
button.primary{border:0;background:linear-gradient(135deg,#9a54c7,#6e4096);border-radius:11px;padding:12px 14px;font-weight:750}button.secondary{border:1px solid #4c3b56;background:#291e31;border-radius:10px;padding:10px 12px}button:disabled{opacity:.4}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{display:flex;flex-wrap:wrap;gap:8px}
.hero{height:205px;border-radius:15px;position:relative;overflow:hidden;background:linear-gradient(#281a32 0 60%,#4a2e32 60% 66%,#191017 66%);border:1px solid #49334f}.shelf{position:absolute;top:49px;left:7%;right:7%;height:48px;border-top:3px solid #684c52}.bottles{position:absolute;top:27px;left:10%;right:10%;display:flex;justify-content:space-around;font-size:29px}.counter{position:absolute;bottom:0;left:0;right:0;height:72px;background:linear-gradient(#533339,#2b1b23);border-top:2px solid #795157}.hero .you{position:absolute;bottom:29px;left:50%;transform:translateX(-50%);font-size:59px}.hero .guest{position:absolute;bottom:50px;left:12%;font-size:51px}.hero .guest2{position:absolute;bottom:50px;right:12%;font-size:51px}
.card{background:#241a2d;border:1px solid #3b2d44;border-radius:12px;padding:11px;margin:7px 0}.customer{display:flex;gap:11px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#36263e;font-size:27px}.tag{font-size:10px;background:#35253e;border-radius:20px;padding:4px 7px}.meter{height:8px;background:#352936;border-radius:20px;overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}
.recipe{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 9px;border-radius:9px;background:#2b2032;border:1px solid #46364e;font-size:12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button{min-height:62px;border:1px solid #4a394f;background:#281e2f;border-radius:12px;font-size:11px}.actions span{display:block;font-size:24px;margin-bottom:3px}.selected{outline:2px solid var(--accent);background:#35233f!important}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#2b2033;border:1px solid #6b5079;padding:11px 15px;border-radius:12px;z-index:60;max-width:90%;box-shadow:0 10px 30px #0009}.modal{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}.modal .panel{max-width:510px;width:100%}
.custom{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{border:1px solid #46354f;background:#281e30;border-radius:12px;padding:11px;text-align:center}.choice.active{outline:2px solid var(--accent);background:#36233f}.portrait{font-size:72px;text-align:center;padding:10px}.skill{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.guideTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.guideTabs button{border:1px solid #4a394f;background:#281e2f;border-radius:9px;padding:9px 3px;font-size:11px}.guideTabs .on{background:#6f4097;border-color:#a266ca}
.recipeGuide{display:grid;grid-template-columns:1fr 1fr;gap:8px}.recipeGuide .card{margin:0}.locked{opacity:.45}.search{width:100%;padding:11px;border-radius:10px;border:1px solid #4b3b55;background:#241a2d;color:white;margin-bottom:9px}
</style>
</head>
<body><div id="app"></div>
<script>
const DRINKS=[
{name:"Highball",category:"Long",tech:"Build",glass:"Highball",ice:"Cubed",garnish:"Lemon",need:["Glass","Ice","Whisky","Soda","Lemon"],icon:"🥃",pay:10,xp:8,notes:"Clean, refreshing and fast. A good first drink to master."},
{name:"Old Fashioned",category:"Classic",tech:"Stir",glass:"Rocks",ice:"Large cube",garnish:"Orange",need:["Rocks Glass","Ice","Bourbon","Bitters","Sugar","Orange"],icon:"🥃",pay:18,xp:14,notes:"Balance the sweetness and dilution. Don't drown it in ice."},
{name:"Margarita",category:"Sour",tech:"Shake",glass:"Coupe",ice:"Shaken",garnish:"Salt + lime",need:["Coupe","Ice","Tequila","Triple Sec","Lime","Salt"],icon:"🍸",pay:20,xp:16,notes:"Bright citrus, controlled dilution and a clean finish."},
{name:"Negroni",category:"Classic",tech:"Stir",glass:"Rocks",ice:"Large cube",garnish:"Orange",need:["Rocks Glass","Ice","Gin","Campari","Sweet Vermouth","Orange"],icon:"🍷",pay:23,xp:18,notes:"Equal-parts bitter classic. Stir until cold and silky."},
{name:"Daiquiri",category:"Sour",tech:"Shake",glass:"Coupe",ice:"Shaken",garnish:"Lime",need:["Coupe","Ice","Rum","Lime","Sugar"],icon:"🍸",pay:20,xp:15,notes:"Simple recipe, difficult balance. Fresh lime matters."},
{name:"Espresso Martini",category:"Modern",tech:"Shake",glass:"Martini",ice:"Hard shake",garnish:"Coffee beans",need:["Martini Glass","Ice","Vodka","Coffee Liqueur","Espresso","Sugar"],icon:"🍸",pay:28,xp:20,notes:"Hard shake for texture and foam."},
{name:"Whisky Sour",category:"Sour",tech:"Shake",glass:"Rocks",ice:"Fresh ice",garnish:"Lemon",need:["Rocks Glass","Ice","Whisky","Lemon","Sugar","Egg White"],icon:"🥃",pay:30,xp:21,notes:"Egg white is optional in some bars, but adds texture and body."},
{name:"Dry Martini",category:"Classic",tech:"Stir",glass:"Martini",ice:"Very cold",garnish:"Olive",need:["Martini Glass","Ice","Gin","Dry Vermouth","Olive"],icon:"🍸",pay:35,xp:24,notes:"Cold, balanced and precise. Ask whether they prefer olive or twist."}
];
const ING=["Glass","Rocks Glass","Coupe","Martini Glass","Ice","Whisky","Bourbon","Soda","Lemon","Bitters","Sugar","Orange","Tequila","Triple Sec","Lime","Salt","Gin","Campari","Sweet Vermouth","Rum","Vodka","Coffee Liqueur","Espresso","Egg White","Dry Vermouth","Olive"];
const ICO={Ice:"🧊",Lemon:"🍋",Lime:"🍋",Orange:"🍊",Olive:"🫒",Sugar:"🧂",Salt:"🧂",Espresso:"☕","Egg White":"🥚",Whisky:"🥃",Bourbon:"🥃",Rum:"🥃",Vodka:"🍶",Gin:"🍸",Tequila:"🥃",Campari:"🧴","Sweet Vermouth":"🍷","Dry Vermouth":"🍷","Coffee Liqueur":"🧴","Triple Sec":"🧴",Soda:"🫧",Bitters:"🧴",Glass:"🥛","Rocks Glass":"🥃",Coupe:"🍸","Martini Glass":"🍸"};
const BARS=[
{name:"The Copper Kettle",type:"Neighborhood Pub",desc:"Your first home. Warm, busy and forgiving.",lvl:1,mult:1},
{name:"Velvet Room",type:"Cocktail Lounge",desc:"Precision and presentation matter.",lvl:5,mult:1.25},
{name:"Neon Harbor",type:"Nightclub",desc:"Fast tickets, loud music, big tips.",lvl:9,mult:1.45},
{name:"Sol y Sal",type:"Beach Bar",desc:"Sunset service and guest shifts.",lvl:13,mult:1.55},
{name:"The Blackbird",type:"Whisky Bar",desc:"A serious room for serious spirits.",lvl:17,mult:1.8},
{name:"Aster Hotel",type:"Luxury Hotel",desc:"Discretion, elegance and impossible standards.",lvl:22,mult:2.1}
];
const CUSTOMERS=[
{name:"Nina",emoji:"👩🏻",likes:["Negroni","Daiquiri"],pref:["bitter","citrus"],bio:"A designer who visits after work. She remembers bartenders who remember her."},
{name:"Marcus",emoji:"🧔🏽",likes:["Old Fashioned","Whisky Sour"],pref:["whisky","classic"],bio:"A quiet regular who likes classics and hates rushed service."},
{name:"Sofia",emoji:"👩🏽‍🦱",likes:["Margarita","Daiquiri"],pref:["citrus","rum"],bio:"A photographer who loves discovering new drinks."},
{name:"Eli",emoji:"🧑🏻",likes:["Highball","Dry Martini"],pref:["clean","simple"],bio:"A software engineer who arrives late and orders with surprising precision."},
{name:"Ravi",emoji:"🧑🏾‍🦱",likes:["Espresso Martini","Negroni"],pref:["coffee","bitter"],bio:"A musician who becomes a late-night fixture."},
{name:"Claire",emoji:"👩🏼",likes:["Dry Martini","Margarita"],pref:["clean","citrus"],bio:"A hotel guest who may know people who can advance your career."}
];
const EVENTS=[
[2,"The Broken Glass","A tray slips during your first rush. Maya teaches you to reset without panicking.",12,0,2],
[4,"The Regular's Test","Nina asks for something outside her usual order.",18,20,3],
[7,"Rainy Friday","The room fills unexpectedly. Your speed is put to the test.",30,45,5],
[10,"The Review","A local drinks writer has been watching the bar all night.",40,80,8],
[14,"Guest Shift Offer","Iris offers you a guest shift at Sol y Sal.",35,60,10],
[18,"The Rival","A famous bartender challenges you to a three-drink speed round.",50,120,12],
[22,"A Name of Your Own","The Aster Hotel manager asks you to lead a pop-up.",70,250,18]
];
function fresh(){return{tab:"home",guide:"recipes",lvl:1,xp:0,money:35,rep:0,bar:0,shift:0,served:0,perfect:0,build:[],recipe:null,customer:null,customers:{},seen:[],event:null,skills:{speed:1,mixology:1,knowledge:1,charm:1,perception:1,management:1},points:0,character:{name:"Alex",skin:"🧑🏽"},up:{ice:false,tools:false,glass:false}}}
let S=(()=>{try{return JSON.parse(localStorage.getItem("tns4"))||fresh()}catch(e){return fresh()}})();
const save=()=>localStorage.setItem("tns4",JSON.stringify(S));
const xpNeed=()=>80+S.lvl*35;
const rank=()=>S.lvl<4?"Barback":S.lvl<8?"Junior Bartender":S.lvl<16?"Bartender":S.lvl<24?"Senior Bartender":"Guest Bartender";
const currentBar=()=>BARS[S.bar];
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
function gain(x,m,r){S.xp+=x;S.money+=m;S.rep+=r;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.lvl++;S.points+=3;toast("Promotion! +3 skill points — "+rank());unlock()}save()}
function unlock(){BARS.forEach((b,i)=>{if(S.lvl>=b.lvl&&!S.seen.includes("bar"+i)){S.seen.push("bar"+i);toast("New venue unlocked: "+b.name)}});EVENTS.forEach(e=>{if(S.lvl>=e[0]&&!S.seen.includes(e[1])){S.seen.push(e[1]);S.event=e}});save()}
function nav(t){S.tab=t;render()}
function render(){let p=Math.min(100,S.xp/xpNeed()*100);document.getElementById("app").innerHTML=`<header><div class="title">🍸 The Night Shift</div><div class="sub">${rank()} • ${currentBar().name}</div><div class="stats"><div class="stat">LEVEL<b>${S.lvl}</b></div><div class="stat">XP<b>${S.xp}/${xpNeed()}</b></div><div class="stat">💰<b>€${S.money}</b></div><div class="stat">⭐<b>${S.rep}</b></div></div><div class="xp"><i style="width:${p}%"></i></div></header><main>${page()}</main><nav>${[["home","🏠","Home"],["shift","🍸","Shift"],["career","📈","Career"],["bar","🏪","Bar"],["people","👥","Regulars"],["guide","📚","Guide"]].map(x=>`<button class="${S.tab===x[0]?"active":""}" onclick="nav('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join("")}</nav>`;if(S.event)eventModal()}
function page(){return({home:home,shift:shift,career:career,bar:barPage,people:people,guide:guide}[S.tab]||home)()}
function home(){return`<div class="panel"><div class="hero"><div class="bottles">🍾 🥃 🍸 🧴 🍋 🫙</div><div class="shelf"></div><div class="guest">🧑🏻</div><div class="guest2">👩🏽</div><div class="you">${S.character.skin}</div><div class="counter"></div></div><h2>${currentBar().name}</h2><p class="muted">${currentBar().desc}</p><div class="row"><span>Shift #${S.shift+1}</span><button class="primary" onclick="startShift()">Start Shift</button></div></div>
<div class="panel"><h2>${S.character.name}</h2><div class="row"><span>${rank()}</span><span class="gold">${S.points} skill points</span></div><p class="small muted">Great drinks build money, reputation and relationships.</p><button class="secondary" onclick="nav('career')">Develop character</button></div>
<div class="panel"><h2>Tonight's regulars</h2>${CUSTOMERS.filter(c=>S.customers[c.name]?.regular).slice(0,3).map(regularMini).join("")||"<p class='muted small'>No regulars yet. Impress guests and they'll start coming back.</p>"}</div>`}
function regularMini(c){let d=S.customers[c.name]||{};return`<div class="card"><div class="customer"><div class="avatar">${c.emoji}</div><div><b>${c.name}</b> <span class="tag">Regular</span><div class="small muted">Relationship ${d.rel||0}/100 • Visits ${d.visits||0}</div></div></div></div>`}
function startShift(){S.tab="shift";S.shift++;newOrder();save();render()}
function newOrder(){let max=Math.min(DRINKS.length,Math.max(2,Math.floor((S.lvl+2)/2)));let d=DRINKS[Math.floor(Math.random()*max)];let regulars=CUSTOMERS.filter(c=>S.customers[c.name]?.regular);let pool=regulars.length&&Math.random()<.55?regulars:CUSTOMERS;let c=pool[Math.floor(Math.random()*pool.length)];S.recipe=d;S.build=[];S.customer={name:c.name,patience:70,profile:c};}
function shift(){if(!S.recipe)return`<div class="panel"><h2>Ready for service?</h2><button class="primary" onclick="startShift()">Open the bar</button></div>`;let d=S.recipe,c=S.customer.profile;let rel=S.customers[c.name]?.rel||0;return`<div class="panel"><div class="customer"><div class="avatar">${c.emoji}</div><div><b>${c.name}</b>${S.customers[c.name]?.regular?` <span class="tag">REGULAR</span>`:""}<div class="small muted">${c.bio}</div></div></div><p style="font-size:17px">“I'll have a <b>${d.name}</b>, please.”</p><div class="row"><span class="small">Patience</span><span class="gold">${S.customer.patience}%</span></div><div class="meter"><i style="width:${S.customer.patience}%"></i></div><h3>Build the drink</h3><div class="actions">${ING.map(x=>`<button class="${S.build.includes(x)?"selected":""}" onclick="pick('${x.replace(/'/g,"\\\\'")}')"><span>${ICO[x]||"•"}</span>${x}</button>`).join("")}</div><h3>Your build</h3><div class="recipe">${S.build.length?S.build.map((x,i)=>`<span class="chip">${i+1}. ${x}</span>`).join(""):"<span class='muted small'>Nothing yet</span>"}</div><div class="wrap" style="margin-top:12px"><button class="primary" onclick="serve()">Serve ${d.name}</button><button class="secondary" onclick="S.build=[];render()">Clear</button><button class="secondary" onclick="nav('guide')">📚 Recipe guide</button></div></div>
<div class="panel"><b>${S.customers[c.name]?.regular?"Regular's note":"First impression"}</b><p class="small muted">${S.customers[c.name]?.regular?`Relationship: ${rel}/100. Check the guide to remember their favorite drink.`:`A guest can become a regular after enough positive visits.`}</p></div>`}
function pick(x){S.build.push(x);S.customer.patience=Math.max(0,S.customer.patience-(S.up.ice?2:3));render()}
function serve(){let d=S.recipe,c=S.customer.profile,old=S.customers[c.name]||{rel:0,visits:0,regular:false,favorites:{}};let exact=S.build.length===d.need.length&&S.build.every((x,i)=>x===d.need[i]);let correct=S.build.filter((x,i)=>x===d.need[i]).length;let score=Math.round(correct/d.need.length*100);let liked=c.likes.includes(d.name);let bonus=exact?1.5:score>=70?1:.65;if(liked)bonus+=.25;if(S.skills.mixology>1)bonus+=.03*(S.skills.mixology-1);let tip=Math.max(1,Math.round(d.pay*bonus*currentBar().mult*(S.up.glass?1.1:1)));let xp=Math.max(3,Math.round(d.xp*bonus));let rep=exact?3:score>=70?1:0;if(liked)rep+=2;S.served++;if(exact)S.perfect++;old.visits=(old.visits||0)+1;old.rel=Math.min(100,(old.rel||0)+(exact?(liked?14:9):score>=70?4:1));old.favorites[d.name]=(old.favorites[d.name]||0)+1;if(old.rel>=35&&!old.regular){old.regular=true;toast(c.name+" became a regular! ❤️")}if(old.rel>=70&&liked)toast(c.name+" really trusts your taste! ⭐");S.customers[c.name]=old;gain(xp,tip,rep);toast(`${exact?"Perfect":"Served"} ${d.name} • +${xp} XP • €${tip}`);if(S.served%5===0){S.recipe=null;render()}else{newOrder();render()}}
function career(){let desc={speed:"Faster service and rush performance",mixology:"Higher rewards for quality drinks",knowledge:"Unlock recipes and improve guest reads",charm:"Better tips and relationship gains",perception:"Better clues about guest preferences",management:"Improves venue upgrades"};return`<div class="panel"><h2>Character</h2><div class="portrait">${S.character.skin}</div><div class="row"><b>${S.character.name}</b><span>${rank()}</span></div><button class="secondary" style="margin-top:8px" onclick="customize()">Customize</button></div><div class="panel"><div class="row"><h2 style="margin:0">Skill points</h2><span class="gold">${S.points} available</span></div>${Object.entries(S.skills).map(([k,v])=>`<div class="card"><div class="row"><b>${k[0].toUpperCase()+k.slice(1)}</b><span>Lv ${v}</span></div><div class="small muted">${desc[k]}</div><button class="secondary" style="margin-top:7px" ${S.points<1?"disabled":""} onclick="spend('${k}')">Spend 1 point</button></div>`).join("")}</div><div class="panel"><h2>Career ladder</h2>${[["Barback",1],["Junior Bartender",4],["Bartender",8],["Senior Bartender",16],["Guest Bartender",24]].map(x=>`<div class="card ${S.lvl<x[1]?"locked":""}"><b>${S.lvl>=x[1]?"✓":"🔒"} ${x[0]}</b><div class="small muted">Level ${x[1]}</div></div>`).join("")}</div>`}
function spend(k){if(S.points>0){S.points--;S.skills[k]++;save();render()}}
function customize(){let x=document.createElement("div");x.className="modal";x.innerHTML=`<div class="panel"><h2>Customize bartender</h2><h3>Name</h3><input id="nm" value="${S.character.name}" style="width:100%;padding:11px;border-radius:9px;border:1px solid #4b3b55;background:#241a2d;color:white"><h3>Appearance</h3><div class="custom">${["🧑🏽","👩🏽","🧑🏻","👩🏻","🧑🏾","👩🏾"].map(a=>`<button class="choice ${S.character.skin===a?"active":""}" onclick="S.character.skin='${a}';document.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${a}</button>`).join("")}</div><div class="wrap" style="margin-top:12px"><button class="primary" onclick="S.character.name=document.getElementById('nm').value.trim()||'Alex';save();x.remove();render()">Save</button><button class="secondary" onclick="x.remove()">Cancel</button></div></div>`;document.body.appendChild(x)}
function barPage(){return`<div class="panel"><h2>Venues</h2>${BARS.map((b,i)=>`<div class="card ${S.lvl<b.lvl?"locked":""}"><div class="row"><b>${i===S.bar?"📍 ":""}${b.name}</b><span>${S.lvl>=b.lvl?"Unlocked":"Lv "+b.lvl}</span></div><div class="small muted">${b.type} — ${b.desc}</div><div class="small gold">Reward ×${b.mult}</div>${S.lvl>=b.lvl&&i!==S.bar?`<button class="secondary" style="margin-top:7px" onclick="travel(${i})">Travel here</button>`:""}</div>`).join("")}</div><div class="panel"><h2>Bar upgrades</h2>${[["ice","🧊 Ice machine",90,"Guests lose patience more slowly"],["tools","🔧 Precision tools",140,"Better quality training"],["glass","🍸 Premium glassware",220,"10% higher tips"]].map(x=>`<div class="card"><div class="row"><b>${x[1]}</b><span>${S.up[x[0]]?"OWNED":"€"+x[2]}</span></div><div class="small muted">${x[3]}</div>${!S.up[x[0]]?`<button class="secondary" style="margin-top:7px" ${S.money<x[2]?"disabled":""} onclick="buy('${x[0]}',${x[2]})">Buy</button>`:""}</div>`).join("")}</div>`}
function travel(i){S.bar=i;save();toast("Now working at "+BARS[i].name);render()}
function buy(k,c){if(S.money>=c&&!S.up[k]){S.money-=c;S.up[k]=true;save();toast("Upgrade installed");render()}}
function people(){return`<div class="panel"><h2>Customers & Regulars</h2><p class="muted small">Every guest has preferences. Great drinks and remembered details build relationships.</p>${CUSTOMERS.map(c=>{let d=S.customers[c.name]||{rel:0,visits:0,regular:false,favorites:{}};let fav=Object.entries(d.favorites).sort((a,b)=>b[1]-a[1])[0];return`<div class="card"><div class="customer"><div class="avatar">${c.emoji}</div><div><b>${c.name}</b> ${d.regular?'<span class="tag">REGULAR</span>':''}<div class="small muted">${c.bio}</div></div></div><div style="margin-top:8px" class="row"><span class="small">Relationship</span><span class="small">${d.rel}/100</span></div><div class="meter"><i style="width:${d.rel}%"></i></div><div class="small muted" style="margin-top:7px">Visits: ${d.visits||0}${fav?` • Favorite: ${fav[0]}`:""}</div><div class="small gold" style="margin-top:5px">Likes: ${c.likes.join(" • ")}</div></div>`}).join("")}</div>`}
function guide(){let g=S.guide;return`<div class="panel"><h2>📚 Bartender's Guide</h2><p class="muted small">Use this during shifts to remember recipes, techniques and guests.</p><div class="guideTabs">${[["recipes","🍸 Recipes"],["tech","🧊 Techniques"],["basics","📖 Basics"]].map(x=>`<button class="${g===x[0]?"on":""}" onclick="S.guide='${x[0]}';render()">${x[1]}</button>`).join("")}</div>${g==="recipes"?recipeGuide():g==="tech"?techGuide():basicGuide()}</div>`}
function recipeGuide(){return`<input class="search" placeholder="Search cocktails..." oninput="filterRecipes(this.value)"><div id="recipeList" class="recipeGuide">${DRINKS.map((d,i)=>`<div class="card recipeCard"><div class="row"><b>${d.icon} ${d.name}</b><span class="tag">${d.category}</span></div><div class="small muted">${d.tech} • ${d.glass} • ${d.ice}</div><div class="recipe" style="margin-top:7px">${d.need.map(x=>`<span class="chip">${ICO[x]||"•"} ${x}</span>`).join("")}</div><p class="small">${d.notes}</p><div class="small gold">Favorite guests may react especially well to this drink.</div></div>`).join("")}</div>`}
function filterRecipes(q){q=q.toLowerCase();document.querySelectorAll(".recipeCard").forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?"block":"none")}
function techGuide(){return`<div class="card"><b>Build</b><p class="small muted">Assemble ingredients directly in the serving glass. Fast and efficient for long drinks.</p></div><div class="card"><b>Stir</b><p class="small muted">Stir with ice to chill and dilute while keeping the drink clear and silky.</p></div><div class="card"><b>Shake</b><p class="small muted">Shake hard with ice to chill, dilute and aerate. Essential for sours and drinks with citrus or egg white.</p></div><div class="card"><b>Ice</b><p class="small muted">Cold, dense ice is your friend. It chills quickly and melts more slowly.</p></div><div class="card"><b>Garnish</b><p class="small muted">Garnish should support the drink's aroma and appearance, not just decorate the glass.</p></div>`}
function basicGuide(){return`<div class="card"><b>How to become a regular's favorite</b><ol class="small"><li>Make the requested drink correctly.</li><li>Learn what the guest likes.</li><li>Remember their usual.</li><li>Occasionally surprise them with something suited to their taste.</li><li>Build the relationship over multiple visits.</li></ol></div><div class="card"><b>Career</b><p class="small muted">Earn XP from shifts. Leveling grants skill points. Reputation unlocks better venues and guest-bartending opportunities.</p></div><div class="card"><b>Economy</b><p class="small muted">Tips fund training and bar upgrades. Higher-tier venues multiply your earnings.</p></div>`}
function eventModal(){let e=S.event,x=document.createElement("div");x.className="modal";x.innerHTML=`<div class="panel"><div class="small gold">STORY EVENT</div><h2>${e[1]}</h2><p>${e[2]}</p><div class="card">Reward: +${e[3]} XP • €${e[4]} • +${e[5]} reputation</div><button class="primary" onclick="gain(${e[3]},${e[4]},${e[5]});S.event=null;render()">Continue</button></div>`;document.body.appendChild(x)}
function reset(){if(confirm("Reset all progress?")){S=fresh();save();render()}}
unlock();render();
</script></body></html>
