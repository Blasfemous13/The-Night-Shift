<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#100b15"><title>The Night Shift — Career Edition</title><style>:root{--bg:#100b15;--p:#1d1624;--p2:#281d31;--l:#413049;--a:#b96ce6;--g:#f2c66d;--ok:#6cda98;--bad:#ef7777;--t:#f8f0e9;--m:#aaa0af}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#07050a;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button{font:inherit;color:inherit}#app{max-width:820px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a1735,#100b15 48%);padding-bottom:90px}header{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 15px 10px;background:#120d18ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--l)}.title{font-size:22px;font-weight:800}.sub,.muted{color:var(--m)}.sub{font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stat{background:#211728;border:1px solid var(--l);border-radius:10px;text-align:center;padding:6px;font-size:10px}.stat b{display:block;font-size:15px}.xp,.meter{height:7px;background:#30233a;border-radius:20px;overflow:hidden;margin-top:7px}.xp i,.meter i{display:block;height:100%;background:linear-gradient(90deg,#8649b5,#dc8df1)}nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:820px;margin:auto;background:#140e1bf4;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}nav button{background:none;border:0;color:#9f93a8;font-size:10px;padding:4px 2px;border-radius:9px}nav button b{display:block;font-size:20px;line-height:21px}nav button.active{color:white;background:#2c1d37}main{padding:14px}.panel{background:linear-gradient(180deg,#1e1725,#18121e);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 28px #0003}h2{font-size:18px;margin:0 0 9px}h3{font-size:14px;margin:13px 0 7px}.small{font-size:12px}.gold{color:var(--g)}button.primary{border:0;background:linear-gradient(135deg,#9a54c7,#6e4096);border-radius:11px;padding:12px 14px;font-weight:750}button.secondary{border:1px solid #4c3b56;background:#291e31;border-radius:10px;padding:10px 12px}button:disabled{opacity:.4}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{display:flex;flex-wrap:wrap;gap:8px}.hero{height:205px;border-radius:15px;position:relative;overflow:hidden;background:linear-gradient(#281a32 0 60%,#4a2e32 60% 66%,#191017 66%);border:1px solid #49334f}.bottles{position:absolute;top:27px;left:10%;right:10%;display:flex;justify-content:space-around;font-size:29px}.shelf{position:absolute;top:49px;left:7%;right:7%;height:48px;border-top:3px solid #684c52}.counter{position:absolute;bottom:0;left:0;right:0;height:72px;background:linear-gradient(#533339,#2b1b23);border-top:2px solid #795157}.you{position:absolute;bottom:29px;left:50%;transform:translateX(-50%);font-size:59px}.guest{position:absolute;bottom:50px;left:12%;font-size:51px}.guest2{position:absolute;bottom:50px;right:12%;font-size:51px}.card{background:#241a2d;border:1px solid #3b2d44;border-radius:12px;padding:11px;margin:7px 0}.customer{display:flex;gap:11px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#36263e;font-size:27px}.tag{font-size:10px;background:#35253e;border-radius:20px;padding:4px 7px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button{min-height:62px;border:1px solid #4a394f;background:#281e2f;border-radius:12px;font-size:11px}.actions span{display:block;font-size:24px;margin-bottom:3px}.selected{outline:2px solid var(--a);background:#35233f!important}.recipe{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 9px;border-radius:9px;background:#2b2032;border:1px solid #46364e;font-size:12px}.portrait{text-align:center;font-size:72px;padding:8px}.custom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{border:1px solid #46354f;background:#281e30;border-radius:12px;padding:12px}.choice.active{outline:2px solid var(--a)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2033;border:1px solid #6b5079;padding:11px 15px;border-radius:12px;z-index:60;max-width:90%}.modal{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}.modal .panel{max-width:510px;width:100%}.locked{opacity:.45}</style></head><body><div id="app"></div><script>
const D=[['Highball',['Glass','Ice','Whisky','Soda','Lemon'],'🥃',10,8],['Old Fashioned',['Rocks Glass','Ice','Bourbon','Bitters','Sugar','Orange'],'🥃',18,14],['Margarita',['Coupe','Ice','Tequila','Triple Sec','Lime','Salt'],'🍸',20,16],['Negroni',['Rocks Glass','Ice','Gin','Campari','Sweet Vermouth','Orange'],'🍷',23,18],['Daiquiri',['Coupe','Ice','Rum','Lime','Sugar'],'🍸',20,15],['Espresso Martini',['Martini Glass','Ice','Vodka','Coffee Liqueur','Espresso','Sugar'],'🍸',28,20],['Whisky Sour',['Rocks Glass','Ice','Whisky','Lemon','Sugar','Egg White'],'🥃',30,21],['Dry Martini',['Martini Glass','Ice','Gin','Dry Vermouth','Olive'],'🍸',35,24]];
const I=['Glass','Rocks Glass','Coupe','Martini Glass','Ice','Whisky','Bourbon','Soda','Lemon','Bitters','Sugar','Orange','Tequila','Triple Sec','Lime','Salt','Gin','Campari','Sweet Vermouth','Rum','Vodka','Coffee Liqueur','Espresso','Egg White','Dry Vermouth','Olive'],ICO={Ice:'🧊',Lemon:'🍋',Lime:'🍋',Orange:'🍊',Olive:'🫒',Sugar:'🧂',Salt:'🧂',Espresso:'☕','Egg White':'🥚',Whisky:'🥃',Bourbon:'🥃',Rum:'🥃',Vodka:'🍶',Gin:'🍸',Tequila:'🥃',Campari:'🧴','Sweet Vermouth':'🍷','Dry Vermouth':'🍷','Coffee Liqueur':'🧴','Triple Sec':'🧴',Soda:'🫧',Bitters:'🧴',Glass:'🥛','Rocks Glass':'🥃',Coupe:'🍸','Martini Glass':'🍸'};
const B=[['The Copper Kettle','Neighborhood Pub','Your first home. Warm, busy and forgiving.',1,1],['Velvet Room','Cocktail Lounge','Precision and presentation matter.',5,1.25],['Neon Harbor','Nightclub','Fast tickets, loud music, big tips.',9,1.45],['Sol y Sal','Beach Bar','Sunset service and guest shifts.',13,1.55],['The Blackbird','Whisky Bar','A serious room for serious spirits.',17,1.8],['Aster Hotel','Luxury Hotel','Discretion, elegance and impossible standards.',22,2.1]];
const C=[['Nina','👩🏻',['Negroni','Daiquiri'],'A designer who visits after work.'],['Marcus','🧔🏽',['Old Fashioned','Whisky Sour'],'A quiet regular who loves classics.'],['Sofia','👩🏽‍🦱',['Margarita','Daiquiri'],'A photographer who loves new drinks.'],['Eli','🧑🏻',['Highball','Dry Martini'],'A late-night regular with precise tastes.'],['Ravi','🧑🏾‍🦱',['Espresso Martini','Negroni'],'A musician who lives after midnight.'],['Claire','👩🏼',['Dry Martini','Margarita'],'A hotel guest with useful connections.']];
const E=[[2,'The Broken Glass','A tray slips during your first rush. Maya teaches you to reset without panicking.',12,0,2],[4,"The Regular's Test",'Nina asks for something outside her usual order.',18,20,3],[7,'Rainy Friday','The room fills unexpectedly. Your speed is tested.',30,45,5],[10,'The Review','A local drinks writer has been watching the bar.',40,80,8],[14,'Guest Shift Offer','Iris offers you a guest shift at Sol y Sal.',35,60,10],[18,'The Rival','A famous bartender challenges you to a three-drink speed round.',50,120,12],[22,'A Name of Your Own','The Aster Hotel manager asks you to lead a pop-up.',70,250,18]];
function fresh(){return{tab:'home',lvl:1,xp:0,money:35,rep:0,bar:0,shift:0,served:0,perfect:0,recipe:null,build:[],cust:null,people:{},seen:[],event:null,points:0,skills:{speed:1,mixology:1,knowledge:1,charm:1,perception:1,management:1},up:{ice:false,tools:false,glass:false},char:{name:'Alex',skin:'🧑🏽'}}}let S=(()=>{try{return JSON.parse(localStorage.getItem('tns3'))||fresh()}catch(e){return fresh()}})();const save=()=>localStorage.setItem('tns3',JSON.stringify(S)),need=()=>80+S.lvl*35,rank=()=>S.lvl<4?'Barback':S.lvl<8?'Junior Bartender':S.lvl<16?'Bartender':S.lvl<24?'Senior Bartender':'Guest Bartender';
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}function gain(x,m,r){S.xp+=x;S.money+=m;S.rep+=r;while(S.xp>=need()){S.xp-=need();S.lvl++;S.points+=3;toast('Promotion! +3 skill points — '+rank())}unlock();save()}function unlock(){B.forEach((b,i)=>{if(S.lvl>=b[3]&&!S.seen.includes('b'+i)){S.seen.push('b'+i);toast('New venue unlocked: '+b[0])}});E.forEach(e=>{if(S.lvl>=e[0]&&!S.seen.includes(e[1])){S.seen.push(e[1]);S.event=e}})}function nav(t){S.tab=t;render()}
function render(){let p=Math.min(100,S.xp/need()*100);document.getElementById('app').innerHTML=`<header><div class=title>🍸 The Night Shift</div><div class=sub>${rank()} • ${B[S.bar][0]}</div><div class=stats><div class=stat>LEVEL<b>${S.lvl}</b></div><div class=stat>XP<b>${S.xp}/${need()}</b></div><div class=stat>💰<b>€${S.money}</b></div><div class=stat>⭐<b>${S.rep}</b></div></div><div class=xp><i style="width:${p}%"></i></div></header><main>${page()}</main><nav>${[['home','🏠','Home'],['shift','🍸','Shift'],['career','📈','Career'],['bar','🏪','Bar'],['people','👥','Regulars']].map(x=>`<button class="${S.tab==x[0]?'active':''}" onclick="nav('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`;if(S.event)eventModal()}
function page(){return({home,shift,career,barPage,people}[S.tab]||home)()}
function home(){let regs=C.filter(c=>S.people[c[0]]?.regular);return`<div class=panel><div class=hero><div class=bottles>🍾 🥃 🍸 🧴 🍋 🫙</div><div class=shelf></div><div class=guest>🧑🏻</div><div class=guest2>👩🏽</div><div class=you>${S.char.skin}</div><div class=counter></div></div><h2>${B[S.bar][0]}</h2><p class=muted>${B[S.bar][2]}</p><div class=row><span>Shift #${S.shift+1}</span><button class=primary onclick=startShift()>Start Shift</button></div></div><div class=panel><h2>${S.char.name}</h2><div class=row><span>${rank()}</span><span class=gold>${S.points} skill points</span></div><button class=secondary style="margin-top:8px" onclick=customize()>Customize character</button></div><div class=panel><h2>Tonight's regulars</h2>${regs.slice(0,3).map(regularCard).join('')||'<p class="small muted">No regulars yet. Make great drinks and remember your guests.</p>'}</div>`}
function regularCard(c){let d=S.people[c[0]];return`<div class=card><div class=customer><div class=avatar>${c[1]}</div><div><b>${c[0]}</b> <span class=tag>REGULAR</span><div class=small>Relationship ${d.rel||0}/100 • Visits ${d.visits||0}</div></div></div></div>`}
function startShift(){S.tab='shift';S.shift++;newOrder();save();render()}function newOrder(){let max=Math.min(D.length,Math.max(2,Math.floor((S.lvl+2)/2))),d=D[Math.floor(Math.random()*max)],pool=C.filter(c=>S.people[c[0]]?.regular||Math.random()<.5),c=pool[Math.floor(Math.random()*pool.length)]||C[0];S.recipe=d;S.build=[];S.cust={c,pat:70}}
function shift(){if(!S.recipe)return`<div class=panel><h2>Ready?</h2><button class=primary onclick=startShift()>Open the bar</button></div>`;let d=S.recipe,c=S.cust.c,rel=S.people[c[0]]?.rel||0;return`<div class=panel><div class=customer><div class=avatar>${c[1]}</div><div><b>${c[0]}</b> ${S.people[c[0]]?.regular?'<span class=tag>REGULAR</span>':''}<div class=small>${c[3]}</div></div></div><p style="font-size:17px">“I'll have a <b>${d[0]}</b>, please.”</p><div class=row><span class=small>Patience</span><span class=gold>${S.cust.pat}%</span></div><div class=meter><i style="width:${S.cust.pat}%"></i></div><h3>Build the drink</h3><div class=actions>${I.map(x=>`<button class="${S.build.includes(x)?'selected':''}" onclick="pick('${x.replace(/'/g,"\\'")}')"><span>${ICO[x]||'•'}</span>${x}</button>`).join('')}</div><h3>Your build</h3><div class=recipe>${S.build.length?S.build.map((x,i)=>`<span class=chip>${i+1}. ${x}</span>`).join(''):'<span class=muted>Nothing yet</span>'}</div><div class=wrap style="margin-top:12px"><button class=primary onclick=serve()>Serve ${d[0]}</button><button class=secondary onclick="S.build=[];render()">Clear</button></div></div><div class=panel><b>${S.people[c[0]]?.regular?'Regular note':'First impression'}</b><p class=small>${S.people[c[0]]?.regular?`Relationship: ${rel}/100. They already know you.`:'A great experience can turn this guest into a regular.'}</p></div>`}
function pick(x){S.build.push(x);S.cust.pat=Math.max(0,S.cust.pat-(S.up.ice?2:3));render()}function serve(){let d=S.recipe,c=S.cust.c,o=S.people[c[0]]||{rel:0,visits:0,regular:false,fav:{}},exact=S.build.length==d[1].length&&S.build.every((x,i)=>x==d[1][i]),correct=S.build.filter((x,i)=>x==d[1][i]).length,score=Math.round(correct/d[1].length*100),liked=c[2].includes(d[0]),mult=(exact?1.5:score>=70?1:.65)+(liked?.25:0),tip=Math.max(1,Math.round(d[3]*mult*B[S.bar][4]*(S.up.glass?1.1:1))),xp=Math.max(3,Math.round(d[4]*mult)),rep=(exact?3:score>=70?1:0)+(liked?2:0);S.served++;if(exact)S.perfect++;o.visits=(o.visits||0)+1;o.rel=Math.min(100,(o.rel||0)+(exact?(liked?14:9):score>=70?4:1));o.fav=o.fav||{};o.fav[d[0]]=(o.fav[d[0]]||0)+1;if(o.rel>=35&&!o.regular){o.regular=true;toast(c[0]+' became a regular! ❤️')}S.people[c[0]]=o;gain(xp,tip,rep);toast((exact?'Perfect! ':'')+'+'+xp+' XP • €'+tip+(liked?' • They loved it!':''));if(S.served%5==0){S.recipe=null;render()}else{newOrder();render()}}
function career(){let names={speed:'Faster service',mixology:'Bigger quality rewards',knowledge:'More recipe knowledge',charm:'Better tips & relationships',perception:'Better customer reads',management:'Better upgrades'};return`<div class=panel><h2>Character</h2><div class=portrait>${S.char.skin}</div><div class=row><b>${S.char.name}</b><span>${rank()}</span></div><button class=secondary style="margin-top:8px" onclick=customize()>Customize</button></div><div class=panel><div class=row><h2>Skills</h2><span class=gold>${S.points} points</span></div>${Object.entries(S.skills).map(([k,v])=>`<div class=card><div class=row><b>${k[0].toUpperCase()+k.slice(1)}</b><span>Lv ${v}</span></div><div class=small>${names[k]}</div><button class=secondary style="margin-top:7px" ${S.points<1?'disabled':''} onclick="spend('${k}')">+1 skill point</button></div>`).join('')}</div><div class=panel><h2>Career ladder</h2>${[['Barback',1],['Junior Bartender',4],['Bartender',8],['Senior Bartender',16],['Guest Bartender',24]].map(x=>`<div class="card ${S.lvl<x[1]?'locked':''}"><b>${S.lvl>=x[1]?'✓':'🔒'} ${x[0]}</b><div class=small>Level ${x[1]}</div></div>`).join('')}</div>`}
function spend(k){if(S.points){S.points--;S.skills[k]++;save();render()}}function customize(){let x=document.createElement('div');x.className='modal';x.innerHTML=`<div class=panel><h2>Customize bartender</h2><input id=nm value="${S.char.name}" style="width:100%;padding:11px;border-radius:9px;border:1px solid #4b3b55;background:#241a2d;color:white"><h3>Appearance</h3><div class=custom>${['🧑🏽','👩🏽','🧑🏻','👩🏻','🧑🏾','👩🏾'].map(a=>`<button class="choice ${S.char.skin==a?'active':''}" onclick="S.char.skin='${a}';document.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${a}</button>`).join('')}</div><div class=wrap style="margin-top:12px"><button class=primary onclick="S.char.name=document.getElementById('nm').value.trim()||'Alex';save();x.remove();render()">Save</button><button class=secondary onclick="x.remove()">Cancel</button></div></div>`;document.body.appendChild(x)}
function barPage(){return`<div class=panel><h2>Venues</h2>${B.map((b,i)=>`<div class="card ${S.lvl<b[3]?'locked':''}"><div class=row><b>${i==S.bar?'📍 ':''}${b[0]}</b><span>${S.lvl>=b[3]?'Unlocked':'Lv '+b[3]}</span></div><div class=small>${b[1]} — ${b[2]}</div><div class="small gold">Reward ×${b[4]}</div>${S.lvl>=b[3]&&i!=S.bar?`<button class=secondary style="margin-top:7px" onclick="travel(${i})">Travel here</button>`:''}</div>`).join('')}</div><div class=panel><h2>Bar upgrades</h2>${[['ice','🧊 Ice machine',90,'Slower patience loss'],['tools','🔧 Precision tools',140,'Future craft bonus'],['glass','🍸 Premium glassware',220,'10% higher tips']].map(x=>`<div class=card><div class=row><b>${x[1]}</b><span>${S.up[x[0]]?'OWNED':'€'+x[2]}</span></div><div class=small>${x[3]}</div>${!S.up[x[0]]?`<button class=secondary style="margin-top:7px" ${S.money<x[2]?'disabled':''} onclick="buy('${x[0]}',${x[2]})">Buy</button>`:''}</div>`).join('')}</div>`}
function travel(i){S.bar=i;save();toast('Welcome to '+B[i][0]);render()}function buy(k,c){if(S.money>=c&&!S.up[k]){S.money-=c;S.up[k]=true;save();toast('Upgrade installed');render()}}
function people(){return`<div class=panel><h2>Customers & Regulars</h2><p class=small muted>Guests remember great drinks, good service and whether you remember them.</p>${C.map(c=>{let d=S.people[c[0]]||{rel:0,visits:0,regular:false,fav:{}};let f=Object.entries(d.fav||{}).sort((a,b)=>b[1]-a[1])[0];return`<div class=card><div class=customer><div class=avatar>${c[1]}</div><div><b>${c[0]}</b> ${d.regular?'<span class=tag>REGULAR</span>':''}<div class=small>${c[3]}</div></div></div><div class=row style="margin-top:8px"><span class=small>Relationship</span><span class=small>${d.rel}/100</span></div><div class=meter><i style="width:${d.rel}%"></i></div><div class=small style="margin-top:7px">Visits: ${d.visits||0}${f?' • Favorite: '+f[0]:''}</div></div>`}).join('')}</div>`}
function eventModal(){let e=S.event,x=document.createElement('div');x.className='modal';x.innerHTML=`<div class=panel><div class="small gold">STORY EVENT</div><h2>${e[1]}</h2><p>${e[2]}</p><div class=card>Reward: +${e[3]} XP • €${e[4]} • +${e[5]} rep</div><button class=primary onclick="gain(${e[3]},${e[4]},${e[5]});S.event=null;render()">Continue</button></div>`;document.body.appendChild(x)}unlock();render();
</script></body></html>
