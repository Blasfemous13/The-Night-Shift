<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#120d18"><title>The Night Shift v2</title>
<style>
:root{--bg:#100b15;--panel:#1b1421;--panel2:#251b2d;--line:#3b2d45;--accent:#b96ce6;--gold:#f2c66d;--text:#f8f0e8;--muted:#a99dae;--good:#6fdb9b;--bad:#ef7777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#08060a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}#game{max-width:820px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% 0,#281735 0,#100b15 45%);padding-bottom:90px}
.top{padding:calc(12px + env(safe-area-inset-top)) 15px 10px;position:sticky;top:0;z-index:20;background:#120d18ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.title{font-weight:800;font-size:22px}.subtitle{color:var(--muted);font-size:12px;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stat{background:#201727;border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px;font-size:11px}.stat b{display:block;font-size:15px;margin-top:2px}.bar{height:7px;background:#30243a;border-radius:20px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8e4fc0,#d28cf0)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;max-width:820px;margin:auto;background:#140e1bf2;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}nav button{background:none;border:0;color:#9d91a6;font-size:11px;padding:5px 2px;border-radius:9px}nav button b{display:block;font-size:20px;line-height:20px}nav button.active{color:white;background:#2b1d35}
main{padding:14px}.panel{background:linear-gradient(180deg,#1d1624,#18121e);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 30px #0003}h2{font-size:18px;margin:0 0 9px}h3{font-size:14px;margin:13px 0 7px}.muted{color:var(--muted)}.small{font-size:12px}.gold{color:var(--gold)}.good{color:var(--good)}.bad{color:var(--bad)}
button.primary{border:0;background:linear-gradient(135deg,#9b55c7,#70419a);border-radius:11px;padding:12px 14px;font-weight:750;box-shadow:0 5px 15px #6d3b9650}button.secondary{border:1px solid #4b3b55;background:#291e31;border-radius:10px;padding:10px 12px}.wrap{display:flex;flex-wrap:wrap;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.barstage{height:210px;border-radius:15px;position:relative;overflow:hidden;background:linear-gradient(#261b31 0 62%,#3a2733 62% 68%,#171019 68%);border:1px solid #46334d}.lamp{position:absolute;top:15px;left:10%;right:10%;height:5px;background:#4b3a50}.lamp:after{content:"";display:block;margin:4px auto;width:80px;height:30px;background:#e4ad5d33;border-radius:50%;filter:blur(8px)}.shelf{position:absolute;left:7%;right:7%;top:45px;height:48px;border-top:3px solid #634b52}.bottles{position:absolute;left:10%;right:10%;top:28px;display:flex;justify-content:space-around;font-size:29px}.counter{position:absolute;bottom:0;left:0;right:0;height:72px;background:linear-gradient(#503237,#2c1c24);border-top:2px solid #775057}.bartender{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-size:58px;filter:drop-shadow(0 5px 3px #0007)}.customer{position:absolute;bottom:52px;font-size:55px;animation:float 2s ease-in-out infinite}.c1{left:10%}.c2{right:10%;animation-delay:.5s}@keyframes float{50%{transform:translateY(-4px)}}.drinkicon{font-size:65px;text-align:center;margin:7px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button{min-height:64px;border:1px solid #4a394f;background:#281e2f;border-radius:12px;font-size:12px}.actions button span{display:block;font-size:25px;margin-bottom:4px}.selected{outline:2px solid var(--accent);background:#32223b!important}.recipe{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 9px;border-radius:9px;background:#2a2031;border:1px solid #43344a;font-size:12px}
.customerCard{display:flex;align-items:center;gap:12px;background:#241a2b;border-radius:12px;padding:10px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#36263e;font-size:27px}.meter{height:9px;background:#352936;border-radius:20px;overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}
.card{background:#241a2b;border:1px solid #3a2c43;border-radius:12px;padding:11px;margin:7px 0}.locked{opacity:.45}.tag{font-size:10px;background:#34243d;border-radius:20px;padding:4px 7px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2033;border:1px solid #695078;padding:11px 15px;border-radius:12px;z-index:60;max-width:88%;box-shadow:0 10px 30px #0009}.modal{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}.modal .panel{max-width:500px;width:100%}
</style></head><body><div id="game"></div>
<script>
const RECIPES=[
["Highball",["Glass","Ice","Whisky","Soda","Lemon"],"🥃",10,8],
["Old Fashioned",["Rocks Glass","Ice","Bourbon","Bitters","Sugar","Orange"],"🥃",18,14],
["Margarita",["Coupe","Ice","Tequila","Triple Sec","Lime","Salt"],"🍸",20,16],
["Negroni",["Rocks Glass","Ice","Gin","Campari","Sweet Vermouth","Orange"],"🍷",23,18],
["Daiquiri",["Coupe","Ice","Rum","Lime","Sugar"],"🍸",20,15],
["Espresso Martini",["Martini Glass","Ice","Vodka","Coffee Liqueur","Espresso","Sugar"],"🍸",28,20],
["Whisky Sour",["Rocks Glass","Ice","Whisky","Lemon","Sugar","Egg White"],"🥃",30,21],
["Dry Martini",["Martini Glass","Ice","Gin","Dry Vermouth","Olive"],"🍸",35,24]
];
const BARS=[
["The Copper Kettle","Neighborhood Pub","A warm local where you learn the fundamentals.",1,1],
["Velvet Room","Cocktail Lounge","Precision, presentation and demanding regulars.",5,1.25],
["Neon Harbor","Nightclub","Fast tickets, loud music and serious tips.",9,1.45],
["Sol y Sal","Beach Bar","Sunset service and tropical guest shifts.",13,1.55],
["The Blackbird","Whisky Bar","A serious room for serious spirits.",17,1.8],
["Aster Hotel","Luxury Hotel","Discretion, elegance and impossible standards.",22,2.1]
];
const EVENTS=[
[2,"The Broken Glass","A tray slips during your first rush. Maya teaches you to reset without panicking.",12,0,2],
[4,"The Regular's Test","Nina asks for a drink you have never made. She waits while you study.",18,20,3],
[7,"Rainy Friday","The room fills unexpectedly. You keep the tickets moving.",30,45,5],
[10,"The Review","A local drinks writer has been watching the bar all night.",40,80,8],
[14,"Guest Shift Offer","Iris offers you a guest shift at Sol y Sal.",35,60,10],
[18,"The Rival","A famous bartender challenges you to a three-drink speed round.",50,120,12],
[22,"A Name of Your Own","The Aster Hotel manager asks you to lead a pop-up.",70,250,18]
];
const PEOPLE=[["Maya","Head Bartender","👩🏽‍🍳","I don't need perfection. I need you to learn from every mistake."],["Leo","Barback","🧑🏻‍🔧","I can run ice faster than anyone in this city. Probably."],["Nina","Regular","👩🏻","Make me something bitter. Surprise me."],["Dante","Bar Manager","🧔🏽","Reputation travels faster than a good bartender."],["Iris","Guest Bartender","👩🏼‍🦱","Every bar has a rhythm. Listen before you pour."]];
function initial(){return{lvl:1,xp:0,money:35,rep:0,bar:0,shift:0,served:0,perfect:0,tab:"home",recipe:null,build:[],customer:null,seen:[],event:null,skills:{speed:1,craft:1,service:1,management:1},up:{ice:false,tools:false,glass:false}}}
let S=(()=>{try{return JSON.parse(localStorage.getItem("tns2"))||initial()}catch(e){return initial()}})();
const save=()=>localStorage.setItem("tns2",JSON.stringify(S));
const need=()=>80+S.lvl*35;
const rank=()=>S.lvl<4?"Barback":S.lvl<8?"Junior Bartender":S.lvl<16?"Bartender":"Guest Bartender";
const bar=()=>BARS[S.bar];
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function gain(x,m,r){S.xp+=x;S.money+=m;S.rep+=r;while(S.xp>=need()){S.xp-=need();S.lvl++;toast("Promotion! You're now a "+rank());unlock()}save()}
function unlock(){BARS.forEach((b,i)=>{if(S.lvl>=b[3]&&!S.seen.includes("bar"+i)){S.seen.push("bar"+i);toast("New venue unlocked: "+b[0])}});EVENTS.forEach(e=>{if(S.lvl>=e[0]&&!S.seen.includes(e[1])){S.seen.push(e[1]);S.event=e}});save()}
function nav(t){S.tab=t;render()}
function render(){
let pct=Math.min(100,S.xp/need()*100);
document.getElementById("game").innerHTML=`<div class="top"><div class="title">🍸 The Night Shift</div><div class="subtitle">${rank()} • ${bar()[0]}</div><div class="stats"><div class="stat">LEVEL<b>${S.lvl}</b></div><div class="stat">XP<b>${S.xp}/${need()}</b></div><div class="stat">💰<b>€${S.money}</b></div><div class="stat">⭐<b>${S.rep}</b></div></div><div class="bar"><i style="width:${pct}%"></i></div></div><main>${page()}</main><nav>${[["home","🏠","Home"],["shift","🍸","Shift"],["career","📈","Career"],["bars","🏪","Bars"],["story","📖","Story"]].map(x=>`<button class="${S.tab===x[0]?"active":""}" onclick="nav('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join("")}</nav>`;
if(S.event)showEvent();
}
function page(){return({home:home,shift:shift,career:career,bars:bars,story:story}[S.tab]||home)()}
function home(){return`<div class="panel"><div class="barstage"><div class="lamp"></div><div class="bottles">🍾 🥃 🍸 🧴 🍋 🫙</div><div class="shelf"></div><div class="customer c1">🧑🏻</div><div class="customer c2">👩🏽</div><div class="bartender">🧑🏽‍🍳</div><div class="counter"></div></div><h2>${bar()[0]}</h2><p class="muted">${bar()[2]}</p><div class="row"><span>Shift #${S.shift+1}</span><button class="primary" onclick="start()">Start Shift</button></div></div>
<div class="panel"><h2>Your crew</h2>${PEOPLE.map(p=>`<div class="card"><div class="customerCard"><div class="avatar">${p[2]}</div><div><b>${p[0]}</b><div class="small muted">${p[1]}</div></div></div><p class="small">${p[3]}</p></div>`).join("")}</div>
<div class="panel"><div class="row"><b>Career record</b><span class="gold">${S.perfect} perfect</span></div><p class="small muted">Guests served: ${S.served} • Current reputation: ${S.rep}</p></div>
<button class="secondary" onclick="resetGame()">Reset save</button>`}
function start(){S.tab="shift";S.shift++;newOrder();save();render()}
function newOrder(){let max=Math.min(RECIPES.length,Math.max(2,Math.floor((S.lvl+1)/2)+1));let a=RECIPES.slice(0,max);let d=a[Math.floor(Math.random()*a.length)];S.recipe=d;S.build=[];S.customer={name:["Sam","Nina","Alex","Jo","Riley","Casey"][S.served%6],mood:60};}
function shift(){if(!S.recipe)return`<div class="panel"><h2>Ready for service?</h2><button class="primary" onclick="start()">Open the bar</button></div>`;let d=S.recipe;
let ing=["Glass","Rocks Glass","Coupe","Martini Glass","Ice","Whisky","Bourbon","Soda","Lemon","Bitters","Sugar","Orange","Tequila","Triple Sec","Lime","Salt","Gin","Campari","Sweet Vermouth","Rum","Vodka","Coffee Liqueur","Espresso","Egg White","Dry Vermouth","Olive"];
return`<div class="panel"><div class="customerCard"><div class="avatar">${["🧑🏻","👩🏽","🧔🏻","👩🏻‍🦰","🧑🏾"][S.served%5]}</div><div><b>${S.customer.name}</b><div class="small muted">“I'll have a ${d[0]}, please.”</div></div></div><div class="drinkicon">${d[2]}</div><div class="row"><b>Order</b><span class="gold">${S.customer.mood}% patience</span></div><div class="meter"><i style="width:${S.customer.mood}%"></i></div><h3>Build the drink</h3><div class="actions">${ing.map((x,i)=>`<button class="${S.build.includes(x)?"selected":""}" onclick="pick('${x.replace(/'/g,"\\\\'")}')"><span>${ico(x)}</span>${x}</button>`).join("")}</div><h3>Your build</h3><div class="recipe">${S.build.length?S.build.map((x,i)=>`<span class="chip">${i+1}. ${x}</span>`).join(""):"<span class='muted small'>Nothing yet</span>"}</div><div class="wrap" style="margin-top:12px"><button class="primary" onclick="serve()">Serve ${d[0]}</button><button class="secondary" onclick="S.build=[];render()">Clear</button></div></div>
<div class="panel"><b>Service note</b><p class="small muted">Exact recipes earn the biggest tip and reputation. Missing or extra ingredients reduce the score.</p></div>`}
function ico(x){return{Ice:"🧊",Lemon:"🍋",Lime:"🍋",Orange:"🍊",Olive:"🫒",Sugar:"🧂",Salt:"🧂",Espresso:"☕","Egg White":"🥚",Whisky:"🥃",Bourbon:"🥃",Rum:"🥃",Vodka:"🍶",Gin:"🍸",Tequila:"🥃",Campari:"🧴","Sweet Vermouth":"🍷","Dry Vermouth":"🍷","Coffee Liqueur":"🧴","Triple Sec":"🧴",Soda:"🫧",Bitters:"🧴","Glass":"🥛","Rocks Glass":"🥃","Coupe":"🍸","Martini Glass":"🍸"}[x]||"•"}
function pick(x){S.build.push(x);S.customer.mood=Math.max(0,S.customer.mood-(S.up.ice?2:3));render()}
function serve(){let d=S.recipe,exact=S.build.length===d[1].length&&S.build.every((x,i)=>x===d[1][i]),correct=S.build.filter((x,i)=>x===d[1][i]).length,score=Math.round(correct/d[1].length*100),mult=bar()[4]*(S.up.glass?1.1:1)*(exact?1.5:score>=70?1:.65),money=Math.max(1,Math.round(d[3]*mult)),xp=Math.max(3,Math.round(d[4]*(exact?1.5:score>=70?1:.65))),rep=exact?3:score>=70?1:0;S.served++;if(exact)S.perfect++;gain(xp,money,rep);toast(exact?`Perfect! +${xp} XP • €${money} • +${rep} rep`:`${score}% drink • +${xp} XP • €${money}`);if(S.served%5===0){S.recipe=null;render()}else{newOrder();render()}}
function career(){let skills=Object.entries(S.skills).map(([k,v])=>{let c=45+v*25;return`<div class="card"><div class="row"><b>${k[0].toUpperCase()+k.slice(1)}</b><span>Lv ${v}</span></div><div class="small muted">${{speed:"Faster service",craft:"Better precision rewards",service:"More reputation",management:"Better upgrade value"}[k]}</div><button class="secondary" style="margin-top:7px" ${S.money<c?"disabled":""} onclick="skill('${k}',${c})">Train €${c}</button></div>`}).join("");return`<div class="panel"><h2>Career ladder</h2>${[["Barback",1],["Junior Bartender",4],["Bartender",8],["Guest Bartender",16]].map(x=>`<div class="card ${S.lvl<x[1]?"locked":""}"><b>${S.lvl>=x[1]?"✓":"🔒"} ${x[0]}</b><div class="small muted">Level ${x[1]}</div></div>`).join("")}</div><div class="panel"><h2>Skills</h2>${skills}</div>`}
function skill(k,c){if(S.money>=c){S.money-=c;S.skills[k]++;save();toast("Skill upgraded!");render()}}
function bars(){return`<div class="panel"><h2>Venues</h2><p class="muted">Unlock new rooms and guest-bartending opportunities.</p>${BARS.map((b,i)=>`<div class="card ${S.lvl<b[3]?"locked":""}"><div class="row"><b>${i===S.bar?"📍 ":""}${b[0]}</b><span>${S.lvl>=b[3]?"Unlocked":"Lv "+b[3]}</span></div><div class="small muted">${b[1]} — ${b[2]}</div><div class="small gold">Reward ×${b[4]}</div>${S.lvl>=b[3]&&i!==S.bar?`<button class="secondary" style="margin-top:7px" onclick="travel(${i})">Travel here</button>`:""}</div>`).join("")}</div><div class="panel"><h2>Bar upgrades</h2>${[
["ice","🧊 Commercial Ice Machine",90,"Longer guest patience"],
["tools","🔧 Precision Bar Tools",140,"Better craft training"],
["glass","🍸 Premium Glassware",220,"10% better tips"]
].map(x=>`<div class="card"><div class="row"><b>${x[2]?"":""}${x[1]}</b><span>${S.up[x[0]]?"OWNED":"€"+x[2]}</span></div><div class="small muted">${x[3]}</div>${!S.up[x[0]]?`<button class="secondary" style="margin-top:7px" ${S.money<x[2]?"disabled":""} onclick="buy('${x[0]}',${x[2]})">Buy</button>`:""}</div>`).join("")}</div>`}
function travel(i){S.bar=i;save();toast("Now working at "+BARS[i][0]);render()}
function buy(k,c){if(S.money>=c&&!S.up[k]){S.money-=c;S.up[k]=true;save();toast("Upgrade installed");render()}}
function story(){return`<div class="panel"><h2>The Story</h2><p class="muted">A bartender's career is built one shift at a time.</p>${EVENTS.map(e=>`<div class="card ${S.seen.includes(e[1])?"":"locked"}"><div class="row"><b>${S.seen.includes(e[1])?"✓":"🔒"} ${e[1]}</b><span class="tag">Lv ${e[0]}</span></div><p class="small">${e[2]}</p></div>`).join("")}</div><div class="panel"><h2>Cast</h2>${PEOPLE.map(p=>`<div class="card"><div class="customerCard"><div class="avatar">${p[2]}</div><div><b>${p[0]}</b><div class="small muted">${p[1]}</div></div></div></div>`).join("")}</div>`}
function showEvent(){let e=S.event,x=document.createElement("div");x.className="modal";x.innerHTML=`<div class="panel"><div class="small gold">STORY EVENT</div><h2>${e[1]}</h2><p>${e[2]}</p><div class="card">Reward: +${e[3]} XP • €${e[4]} • +${e[5]} rep</div><button class="primary" onclick="gain(${e[3]},${e[4]},${e[5]});S.event=null;render()">Continue</button></div>`;document.body.appendChild(x)}
function resetGame(){if(confirm("Reset all progress?")){S=initial();save();render()}}
unlock();render();
</script></body></html>
